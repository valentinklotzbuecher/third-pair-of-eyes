<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 4.2 190 219.6" role="img" aria-label="Logo of third-pair-of-eyes: a hexagon with two pairs of eyes above and, peeking over the edge of a page with its hands on it, a third pair in mauve.">
  <title>third-pair-of-eyes</title>
  <defs><clipPath id="tpe-hex"><path d="M100 6 L193.53 60 V168 L100 222 L6.47 168 V60 Z"/></clipPath></defs>
  <path d="M100 6 L193.53 60 V168 L100 222 L6.47 168 V60 Z" fill="#FFFFFC"/>
  <!-- the first and the second pair of eyes: the author and the second statistician -->
  <g fill="#FFFFFC" stroke="#2C3A2F" stroke-width="2.2">
    <circle cx="82.5" cy="56" r="10.5"/><circle cx="117.5" cy="56" r="10.5"/>
    <circle cx="78.5" cy="93" r="13"/><circle cx="121.5" cy="93" r="13"/>
  </g>
  <g fill="#2C3A2F">
    <circle cx="82.5" cy="59.4" r="4"/><circle cx="117.5" cy="59.4" r="4"/>
    <circle cx="78.5" cy="96.9" r="4.9"/><circle cx="121.5" cy="96.9" r="4.9"/>
  </g>
  <!-- the third pair -->
  <g fill="#EEE6F2" stroke="#5A317E" stroke-width="2.8">
    <circle cx="74" cy="146" r="20"/><circle cx="126" cy="146" r="20"/>
  </g>
  <g fill="#5A317E"><circle cx="74" cy="147" r="7.8"/><circle cx="126" cy="147" r="7.8"/></g>
  <g fill="#FFFFFC"><circle cx="71.2" cy="143.8" r="2.4"/><circle cx="123.2" cy="143.8" r="2.4"/></g>
  <!-- the page it looks over, and its hands on the edge -->
  <g clip-path="url(#tpe-hex)">
    <rect x="0" y="160" width="200" height="70" fill="#F5F2E8"/>
    <line x1="0" y1="160" x2="200" y2="160" stroke="#2C3A2F" stroke-width="2.6"/>
  </g>
  <g fill="#EEE6F2" stroke="#5A317E" stroke-width="2">
    <rect x="14" y="151.5" width="9.5" height="17.5" rx="4.75"/><rect x="25.5" y="151.5" width="9.5" height="17.5" rx="4.75"/><rect x="37" y="151.5" width="9.5" height="17.5" rx="4.75"/>
    <rect x="153.5" y="151.5" width="9.5" height="17.5" rx="4.75"/><rect x="165" y="151.5" width="9.5" height="17.5" rx="4.75"/><rect x="176.5" y="151.5" width="9.5" height="17.5" rx="4.75"/>
  </g>
  <path d="M100 6 L193.53 60 V168 L100 222 L6.47 168 V60 Z" fill="none" stroke="#2C3A2F" stroke-width="3" stroke-linejoin="miter"/>
</svg>
